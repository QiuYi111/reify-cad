[project]
name = "reify"
version = "0.2.0"
description = "Parametric geometry compilation, multi-start sizing solver, bounded kinematics/DFM/unfitted-physics verification, and verified STEP export for Engineering Agents."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.4",
    "numpy>=1.26",
    "scipy>=1.12",
    "build123d>=0.10",
    "trimesh>=4.4",
    "scikit-image>=0.22",
    "gmsh>=4.12",
    "python-fcl>=0.7",
    "meshio>=5.3",
    "pytest>=8.0",
]

[project.optional-dependencies]
physics = [
    "ngsolve>=6.2",
    "xfem>=2.1",
]

[project.scripts]
reify = "reify.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reify"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
